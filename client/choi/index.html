<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <!-- Game ở /choi (#656): asset tải bằng URL tương đối (sprites/…, tiles.png) tính từ gốc, không phải từ /choi/. -->
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Rừng Săn Hồn Online</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌲</text></svg>">
</head>
<body>
  <div id="stage">
    <div id="game"></div>
    <div id="hud" hidden>
      <div id="lcol">
      <section class="panel stats f2-muc-nho">
        <div class="who"><button class="portrait" id="vhPortrait" type="button" aria-label="Mở menu" aria-controls="hub"><span id="vhGlyph">魂</span></button><div class="who-main"><span id="vhName">–</span><span id="lvl"></span></div></div>
        <div class="bar hp"><i id="hpFill"></i><span id="hpTxt"></span></div>
        <div class="bar mp"><i id="mpFill"></i><span id="mpTxt"></span></div>
        <div class="bar xp"><i id="xpFill"></i><span id="xpTxt"></span></div>
        <div class="bar lei" id="leiBar" hidden><i id="leiFill"></i><span id="leiTxt"></span></div>
        <div class="chips" id="statChips">
          <button id="vhChip" class="stat-chip" type="button" aria-label="Võ hồn đang ra trận: mở bảng Võ Hồn" hidden><span class="chip-ico" aria-hidden="true"></span><span class="chip-txt"></span></button>
          <button id="coinChip" class="stat-chip" type="button" aria-label="Hồn Tệ: mở Túi đồ" hidden><span class="chip-txt"></span></button>
          <button id="ringChip" class="stat-chip" type="button" aria-label="Hồn hoàn: mở bảng Hồn Cốt"><span class="menu-icon" aria-hidden="true">◎</span><span id="ringChipTxt">0/10</span></button>
          <button id="autoChip" class="stat-chip on" type="button" aria-label="Đang tự động: mở bảng Tự động" hidden><span class="menu-icon" aria-hidden="true">◉</span><span id="autoChipTxt">Tự động</span></button>
        </div>
        <div class="buffs" id="buffs" aria-label="Hiệu ứng và trạng thái"></div>
        <div class="buffs" id="bpas" aria-label="Kỹ năng bị động của hồn cốt"></div>
      </section>
      <section id="sideBox" class="panel f2-muc-nho" data-tab="quest" aria-label="Nhiệm vụ và Tổ đội">
        <div class="sb-bar">
          <div class="sb-tabs" role="tablist" aria-label="Khung Nhiệm vụ và Tổ đội">
            <button id="sbTabQuest" class="sb-tab" type="button" role="tab" data-tab="quest" aria-selected="true" aria-controls="quest">Nhiệm vụ</button>
            <button id="sbTabParty" class="sb-tab" type="button" role="tab" data-tab="party" aria-selected="false" aria-controls="party" tabindex="-1">Tổ đội</button>
          </div>
          <button id="sbFold" class="sb-fold" type="button" aria-expanded="true" aria-controls="sbBody" title="Thu gọn khung thành một chip">Gọn</button>
        </div>
        <div id="sbBody" class="sb-body">
          <div id="quest" role="tabpanel" aria-labelledby="sbTabQuest" aria-label="Nhiệm vụ đang làm" hidden></div>
          <small id="sbQuestEmpty" class="sb-empty">Chưa có nhiệm vụ đang làm. Gặp NPC có dấu ! để nhận bài.</small>
          <div id="party" role="tabpanel" aria-labelledby="sbTabParty" aria-label="Tổ đội"></div>
        </div>
      </section>
      </div>
      <div id="pmenu" class="panel" hidden role="dialog" aria-label="Hồn sư"></div>
      <div id="dualTabs" hidden role="tablist" aria-label="Chuyển Nhân vật / Túi"></div>
      <div id="char" class="panel" hidden role="dialog" aria-label="Bảng nhân vật Hồn sư"></div>
      <div id="roster" class="panel" hidden></div>
      <div id="bag" class="panel" hidden></div>
      <div id="reso" class="panel" hidden role="dialog" aria-label="Cộng minh"></div>
      <div id="friends" class="panel" hidden role="dialog" aria-label="Bạn bè"></div>
      <div id="audio" class="panel" hidden role="dialog" aria-label="Cài đặt"></div>
      <div id="autoPanel" class="panel" hidden role="dialog" aria-label="Tự động"></div>
      <div id="autoSum" class="panel" hidden role="dialog" aria-label="Tổng kết tự động"></div>
      <div id="npc" class="panel" hidden role="dialog" aria-label="Hộp thoại NPC"></div>
      <aside id="hub" class="f2-muc-lon" hidden role="dialog" aria-label="Menu"></aside>
      <div id="rank" class="ui2-screen" hidden role="dialog" aria-label="Xếp Hạng"></div>
      <div id="calendar" class="ui2-screen" hidden role="dialog" aria-label="Lịch Hoạt Động"></div>
      <div id="welfare" class="ui2-screen" hidden role="dialog" aria-label="Phúc Lợi"></div>
      <div id="achv" class="ui2-screen" hidden role="dialog" aria-label="Thành Tựu"></div>
      <div id="mail" class="ui2-screen" hidden role="dialog" aria-label="Thư"></div>
      <div id="bicanh" class="ui2-screen" hidden role="dialog" aria-label="Bí Cảnh"></div>
      <div id="notice" class="ui2-screen" hidden role="dialog" aria-label="Thông báo"></div>
      <div id="mapview" hidden role="dialog" aria-label="Bản đồ">
        <canvas id="mapviewCv"></canvas>
        <div id="mapviewBar">
          <span id="mapviewTitle"></span>
          <div id="mapviewLayers" role="group" aria-label="Lớp hiển thị"></div>
          <div class="mvtools">
            <button id="mapviewMode" class="mvbtn" aria-pressed="false" title="Đổi hướng nhìn: xoay theo màn hình / nhìn thẳng (Bắc lên)">Nhìn thẳng</button>
            <button id="mapviewGo" class="mvbtn mvgo" title="Tự đi tới cờ (đóng bản đồ)" hidden>Đi tới cờ</button>
            <button id="mapviewClear" class="mvbtn" title="Xoá cờ" hidden>Xoá cờ</button>
            <button id="mapviewMe" class="mvbtn" title="Về chỗ mình đứng">Về tôi</button>
            <button id="mapviewFit" class="mvbtn mvfit" title="Đặt lại zoom: vừa khung cả bản đồ">⟲ Vừa khung</button>
            <button id="mapviewIn" class="mvbtn mvz" title="Phóng to (lăn chuột lên, chụm hai ngón)">+</button>
            <button id="mapviewOut" class="mvbtn mvz" title="Thu nhỏ">−</button>
            <button id="mapviewClose" class="mvbtn mvx" title="Đóng (M, N hoặc Esc)" aria-label="Đóng bản đồ">×</button>
          </div>
        </div>
        <div id="world" hidden role="tabpanel" aria-label="Bản đồ thế giới"></div>
        <div id="mapviewHelp">Kéo để di chuyển · bấm (điện thoại: chạm giữ) để đặt cờ · chuột phải: "Tập trung ở đây" (tổ đội) · lăn chuột / chụm hai ngón để phóng · ⟲ Vừa khung: đặt lại zoom · M / N / Esc để đóng</div>
        <div id="mapviewTip" hidden></div>
        <div id="mapviewMenu" hidden><button id="mapviewMenuFlag" class="mvbtn">Đặt cờ</button><button id="mapviewMenuRally" class="mvbtn">Tập trung ở đây</button></div>
      </div>
      <div id="rcol">
      <section class="panel mapbox f2-muc-nho">
        <div id="radar" role="img" aria-label="Radar quanh nhân vật">
          <canvas id="mini"></canvas>
          <img id="radarFrame" alt="" hidden>
          <button id="radarMode" class="rbtn" aria-pressed="false" title="Xoay theo màn hình / Nhìn thẳng">◈</button>
          <button id="radarIn" class="rbtn" title="Phóng to (lăn chuột lên)">+</button>
          <button id="radarOut" class="rbtn" title="Thu nhỏ (lăn chuột xuống)">−</button>
          <div id="radarTip" hidden></div>
        </div>
        <div class="radarhead"><div id="zoneName"></div><button id="chanBtn" class="minibtn" aria-controls="chans" aria-expanded="false" title="Chọn kênh" hidden>Kênh ▾</button></div>
        <div class="c12-radar-info"><div id="radarInfo"></div><span id="c12Connection" role="status" tabindex="0" hidden></span></div>
        <button id="worldBtn" class="minibtn f2-nut-phu" aria-controls="mapview" aria-expanded="false" title="Bản đồ (phím M: thế giới, N: khu vực; bấm radar mở khu vực)">Bản đồ <kbd>M</kbd></button>
        <div id="flagBar" hidden aria-live="polite"><span id="flagText"></span><button id="flagGo" class="minibtn" title="Tự đi tới cờ (phím Y)">Đi <kbd>Y</kbd></button><button id="flagStop" class="minibtn" title="Dừng tự đi (hoặc bấm phím di chuyển)" hidden>Dừng <kbd>Y</kbd></button><button id="flagClear" class="minibtn" title="Xoá cờ" aria-label="Xoá cờ">×</button></div>
        <div id="chans" hidden role="dialog" aria-label="Chọn kênh"></div>
      </section>
      </div>
      <div id="bossbar" class="panel" hidden></div>
      <div id="bossCd" hidden></div>
      <div id="bossRank" class="panel" hidden></div>
      <div id="target" class="panel" hidden></div>
      <div id="cmdChip" hidden role="status" aria-live="polite"><span id="cmdChipText"></span><button id="cmdChipX" type="button" title="Huỷ lệnh này" aria-label="Huỷ lệnh này">×</button></div>
      <div id="prompt" class="panel"></div>
      <div id="portal" class="panel" hidden></div>
      <div id="wpbox" class="panel" hidden></div>
      <div id="fusion" class="panel" hidden aria-live="polite" aria-label="Võ Hồn Dung Hợp Kỹ"></div>
      <div id="talk" class="panel" hidden></div>
      <div id="arenaQ" class="panel" hidden aria-live="polite"></div>
      <div id="arenaBar" class="panel" hidden aria-label="Trận Đại Đấu Hồn Trường"></div>
      <div id="arenaEnd" class="panel" hidden role="dialog" aria-label="Kết quả trận đấu hồn"></div>
      <div id="bicanhHud" hidden aria-label="Bí Cảnh"></div>
      <div id="bicanhEnd" class="bc-end" hidden></div>
      <div id="offline" class="panel" hidden role="dialog" aria-label="Ủy thác offline"></div>
      <div id="channel"><div class="label">Đang hấp thụ hồn hoàn…</div><div class="bar"><i id="chFill"></i></div></div>
      <div id="banner"><b></b><span></span></div>
      <div id="bottombar">
      <div id="chatbox">
        <div id="log" aria-live="polite"></div>
        <div id="chattabs" role="tablist" aria-label="Kênh chat"></div>
        <input id="chat" maxlength="120" placeholder="Nhấn Enter để chat" autocomplete="off">
      </div>
      <div id="actbar">
        <div id="team" aria-label="Đội hình: nhấn 1–4 để đổi võ hồn"></div>
        <div id="actrow">
          <div class="action-group bone-group" role="group" aria-label="Hồn cốt">
            <div id="bskills" aria-label="Kỹ năng hồn cốt chủ động: Z, X, C"></div>
          </div>
          <div class="action-group skill-group" role="group" aria-label="Hồn kỹ">
            <div id="skills"></div>
          </div>
          <div class="action-group item-group" role="group" aria-label="Vật phẩm">
            <div id="itemActions"></div>
          </div>
        </div>
      </div>
      </div>
    </div>
    <div id="joy"><div id="knob"></div></div>
    <div id="overlay"><div class="card" id="card"></div></div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
