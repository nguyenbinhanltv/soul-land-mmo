<!doctype html><html lang="vi"><meta charset="utf-8"><title>Cửu Bảo Lưu Ly Tháp — kiểm GameScene</title>
<style>body{background:#142018;color:#eee;font:16px system-ui;margin:24px}a{color:#a9cfff}img{max-width:100%;image-rendering:pixelated}summary{cursor:pointer;padding:10px}</style>
<h1>Cửu Bảo Lưu Ly Tháp — ảnh GameScene tắt tiếng</h1>
<p>Điểm lệch đã được phép: tám tầng thay chín, bệ/chóp không tính. <a href="../NGUON.md">Nguồn và giới hạn</a>. 40 ảnh GameScene và 8 ảnh trang thử nguyên kích thước 1600×900. Kiểm renderer tại mốc cố định, không chứng nhận toàn bộ trận giao chiến.</p><main></main>
<script>fetch('capture.json').then(r=>r.json()).then(r=>{for(const p of r.items){const d=document.createElement('details'),s=document.createElement('summary'),im=document.createElement('img');s.textContent=p.file;im.src=p.file;im.alt=p.file;im.loading='lazy';d.append(s,im);document.querySelector('main').append(d);}});</script></html>
