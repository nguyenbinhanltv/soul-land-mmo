<!doctype html>
<html lang="vi">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bản đồ thế giới — duyệt bố cục</title>
<style>
body{margin:0;background:#241f26;color:#f0e2c2;font:16px system-ui}header{padding:16px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}h1{font-size:20px;margin:0}button{padding:10px;background:#e9d6b1;border:0;border-radius:4px;color:#241f26;cursor:pointer}.viewport{overflow:auto;width:100%;margin:auto}.viewport.doc{width:min(430px,100%);height:min(765px,85vh);border:2px solid #b08a4a}.viewport.doc svg{height:100%;width:auto;max-width:none}svg{display:block;width:100%;height:auto}svg text{font-family:system-ui;font-weight:650;fill:#302831;paint-order:stroke;stroke:#f4e7ca;stroke-width:5;stroke-linejoin:round}svg .map-label{font-size:20px}svg .wp-label{font-size:14px;stroke-width:4}svg .edge{fill:none;stroke:#483c35;stroke-width:2.5;stroke-dasharray:6 4;opacity:.7}svg .boat{stroke:#3e6571;stroke-dasharray:3 6}svg .wp-label{display:none}.labels .wp-label{display:block}.note{padding:12px 16px;margin:0;font-size:14px}#status{font-size:14px}.safe{fill:none;stroke:#9d452c;stroke-width:1.5;stroke-dasharray:10 7;display:none}.safe-on .safe{display:block}
</style>
<header><h1>Bản đồ thế giới · Giấy / Mực</h1><button id="portrait">Khung dọc / toàn tranh</button><label><input type="checkbox" id="labels">Tên truyền tống trận</label><label><input type="checkbox" id="safe">Lề an toàn</label><span id="status">Đang đọc JSON…</span></header>
<p class="note">Bản duyệt mỹ thuật; nút son = bản đồ, chấm ngọc = trận. Rê chuột vào chấm để xem mã thật. Khung dọc cuộn ngang. Chưa tích hợp game.</p>
<div class="viewport" id="viewport"><svg id="map" role="img" aria-label="Tranh thế giới với nút bản đồ, trận và cổng từ dữ liệu thật"></svg></div>
<script type="module">
const ns='http://www.w3.org/2000/svg',svg=document.querySelector('#map'),view=document.querySelector('#viewport');
const el=(tag,attrs,parent=svg)=>{const e=document.createElementNS(ns,tag);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,v);parent.append(e);return e;};
try{
 const d=await fetch('bo-cuc.json').then(r=>{if(!r.ok)throw Error(r.status);return r.json();}),W=d.background.width,H=d.background.height;
 svg.setAttribute('viewBox',`0 0 ${W} ${H}`);el('image',{href:d.background.file,width:W,height:H});
 for(const edge of d.edges)el('polyline',{points:edge.points.map(p=>`${p.x*W},${p.y*H}`).join(' '),class:`edge ${edge.kind==='thuyen'?'boat':''}`});
 const a=d.safeArea;el('rect',{x:a.x*W,y:a.y*H,width:a.width*W,height:a.height*H,class:'safe'});
 for(const m of d.maps){const x=m.position.x*W,y=m.position.y*H,g=el('g',{});el('circle',{cx:x,cy:y,r:6,fill:m.entry==='phong-rieng'?'#8c7960':'#9d452c',stroke:'#f4e7ca','stroke-width':2},g);el('text',{x,y:y+25,'text-anchor':'middle',class:'map-label'},g).textContent=m.name;for(const w of m.waypoints){const wx=w.position.x*W,wy=w.position.y*H,c=el('circle',{cx:wx,cy:wy,r:5,fill:'#527f7c',stroke:'#f4e7ca','stroke-width':2},g);el('title',{},c).textContent=`${w.name} (${w.key})`;el('text',{x:wx+8,y:wy-9,class:'wp-label'},g).textContent=w.name;}}
 document.querySelector('#status').textContent=`${d.maps.length} bản đồ · ${d.maps.reduce((n,m)=>n+m.waypoints.length,0)} trận · ${d.edges.length} cặp cổng`;
 document.querySelector('#portrait').onclick=()=>{view.classList.toggle('doc');if(view.classList.contains('doc'))view.scrollLeft=(svg.getBoundingClientRect().width-view.clientWidth)/2;};
 document.querySelector('#labels').onchange=e=>svg.classList.toggle('labels',e.target.checked);
 document.querySelector('#safe').onchange=e=>svg.classList.toggle('safe-on',e.target.checked);
}catch(e){document.querySelector('#status').textContent=`Không tải được bố cục: ${e.message}`;}
</script>
</html>
