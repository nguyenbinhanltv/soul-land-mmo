# CI: typecheck server + client, validate sprite / tiles.json, build client (check-build); bot RAM và bài thử nhanh (bot-ram, #171)
# cho mọi PR vào main và mỗi push vào main. Status check check-build, bot-ram: chỉ để tham khảo, không bắt buộc (xem CONTRIBUTING.md).
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# Push mới lên cùng PR thì hủy lượt cũ. Trên main mỗi commit một nhóm riêng (theo SHA), nên không lượt nào bị hủy hay bị bỏ.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check-build:
    name: check-build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22 # khớp Dockerfile (node:22-slim)
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json
      # Cài root trước để các công cụ audio (ffmpeg-static) sẵn sàng cho test/validate.
      - run: npm ci
      - run: npm ci --prefix server && npm ci --prefix client
      - run: npm run test:audio
      - run: npm run test:audio --prefix client # AudioManager, nhạc nền (client/scripts/*-test.mjs, Node chạy thẳng .ts)
      - run: npm run audio:validate
      - run: npm run check
      - run: npm run build

  # Bot RAM và các bài thử nhanh (#171), chỉ ubuntu. Chỉ để tham khảo như check-build (không bắt buộc trong bảo vệ nhánh).
  # Bot đầy đủ chạy ~17,5 phút trên runner nên chia 3 nhóm song song (BOT_PART, client/scripts/bot-test.mjs), mỗi nhóm một server mới bật;
  # nhóm 1 chạy thêm các bài nhanh và lượt nhiều kênh. Job bot-ram (cuối file) gộp kết quả thành một status check.
  bot-ram-part:
    name: bot-ram (nhóm ${{ matrix.part }})
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22 # khớp Dockerfile (node:22-slim)
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json
      - id: deps
        run: npm ci --prefix server && npm ci --prefix client
      # Các bài sau chạy độc lập (một bài đỏ vẫn chạy bài khác) miễn là đã cài xong thư viện.
      - if: ${{ !cancelled() && steps.deps.outcome == 'success' && matrix.part == 1 }}
        run: npm run test:predict --prefix client
      - if: ${{ !cancelled() && steps.deps.outcome == 'success' && matrix.part == 1 }}
        run: npm run test:ratelimit --prefix server
      - if: ${{ !cancelled() && steps.deps.outcome == 'success' && matrix.part == 1 }}
        run: npm run test:accounts --prefix server
      # Mỗi lượt một server mới bật (GAME_TEST=1, RAM); bot trượt (dòng ✗) thì bước đỏ và in log server. Tóm tắt ✓ / ✗ / ⚠ ở trang lượt chạy.
      - name: bot nhóm ${{ matrix.part }} (server GAME_TEST=1, RAM)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        env:
          BOT_PART: ${{ matrix.part }}
        run: bash tools/ci/bot-run.sh "nhom-$BOT_PART"
      - name: bot nhiều kênh (CHANNEL_MAX=2)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' && matrix.part == 1 }}
        run: bash tools/ci/bot-run.sh channel CHANNEL_MAX=2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ failure() }}
        with:
          name: bot-logs-${{ matrix.part }}
          path: ci-logs/
          retention-days: 7

  # Một status check bot-ram cho cả 3 nhóm: đỏ khi có nhóm trượt / bị hủy / hết giờ.
  bot-ram:
    name: bot-ram
    needs: bot-ram-part
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULT: ${{ needs.bot-ram-part.result }}
        run: |
          echo "bot-ram (3 nhóm): $RESULT"
          [ "$RESULT" = success ]
