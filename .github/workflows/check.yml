# CI: typecheck server + client, validate sprite / tiles.json, build client (check-build); bot RAM và bài thử nhanh (bot-ram, #171)
# cho mọi PR vào main và mỗi push vào main. Status check check-build, bot-ram: chỉ để tham khảo, không bắt buộc (xem CONTRIBUTING.md).
# Push vào main cũng chọn mức (so với lượt CI main thành công gần nhất, quy tắc chặt hơn PR): chỉ đổi thuần ảnh / sprite / ghi công / tài liệu thì assets; đổi gì khác (kể cả âm thanh) là full.
# Mức chọn theo file PR đổi (job `changes`, tools/ci/changes.sh): assets (chỉ ảnh / sprite / manifest sprite / credits.json / tài liệu: chỉ chạy job nhẹ `assets-check`, bỏ check-build, bot, trình duyệt, docker),
# skip (PR chỉ đổi âm thanh / dữ liệu tĩnh: không chạy bot), smoke (chỉ mã giao diện client: test client + một lượt bot khói ~2 phút), full (còn lại: 6 nhóm).
# Nhãn PR ép mức (đọc lúc chạy, gắn nhãn rồi Re-run hoặc push): ci:full -> full; ci:bot-khoi -> ít nhất smoke. check-build luôn chạy đủ ở mọi mức trừ assets.
# Lượt hằng ngày (schedule / chạy tay trên main, #1118): luôn full, bắt lỗi tích hợp mà merge PR ảnh không phải trả giá. Không kích Release (release.yml chỉ nhận event push).
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 20 * * *" # 20:00 UTC = 03:00 sáng giờ Việt Nam (thấp điểm); chỉ chạy ở nhánh mặc định
  workflow_dispatch: # chạy tay: luôn full

permissions:
  contents: read

# Push mới lên cùng PR thì hủy lượt cũ của PR đó; push mới lên main hủy lượt CI cũ của main (#1079). Nhóm theo số PR (PR khác nhau không hủy nhau) hoặc theo ref (main).
# Lượt bị hủy có conclusion cancelled nên release.yml (gate chỉ nhận success) không chạy Release cho nó; push main chọn mức so với commit của lượt CI main thành công gần nhất (job `changes`), nên lượt bị hủy không làm lượt sau ra `skip`.
concurrency:
  # Lượt hằng ngày / chạy tay có nhóm riêng (#1118): không hủy, cũng không bị hủy bởi push vào main.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || ((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'hang-ngay' || github.ref) }}
  cancel-in-progress: true

jobs:
  # Chọn mức (assets | skip | smoke | full) theo file đổi so với base của PR hoặc mốc push main; schedule / chạy tay luôn full. Quy tắc ở tools/ci/changes.sh.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Chỉ job này cần đọc nhãn hiện tại của PR qua API (không đọc payload sự kiện, vì Re-run giữ payload cũ).
    permissions:
      contents: read
      pull-requests: read
      actions: read # push: tìm lượt CI main thành công gần nhất qua API
    outputs:
      level: ${{ steps.level.outputs.level }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # đủ lịch sử để git diff base...head
          persist-credentials: false
      - id: level
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            # Nhãn đọc lúc chạy: gắn ci:full rồi bấm Re-run (hoặc push) là có hiệu lực.
            LABELS=$(gh api "repos/$REPO/issues/$PR/labels" --jq '[.[].name] | join(",")') || LABELS=ci:full
            export LABELS
            git diff --name-only "$BASE...$HEAD" | bash tools/ci/changes.sh
          elif [ "$EVENT" != push ]; then
            # Lượt hằng ngày (schedule) / chạy tay: luôn full (#1118), không đọc danh sách file.
            FORCE_FULL=1 bash tools/ci/changes.sh </dev/null
          else
            # Push vào main: mốc so sánh = commit của lượt CI main gần nhất có conclusion success (không phải commit ngay trước), vì lượt bị hủy (#1079)
            # chưa quét mã của nó: merge A (server, full) rồi B (docs) mà lượt A bị hủy thì B so với mốc thành công trước A, nên vẫn thấy server/** -> full.
            # Mốc không là tổ tiên của SHA thì không dùng; API lỗi / không có lượt thành công thì dự phòng github.event.before. Không so được thì danh sách rỗng -> full.
            prev=$(gh api "repos/$REPO/actions/workflows/check.yml/runs?branch=main&event=push&status=success&per_page=50" --jq "[.workflow_runs[] | select(.id < $RUN_ID)] | sort_by(.id) | last | .head_sha // empty" 2>/dev/null) || prev=
            if [ -z "$prev" ] || ! git merge-base --is-ancestor "$prev" "$SHA" 2>/dev/null; then prev=$BEFORE; fi
            { git diff --name-only "$prev" "$SHA" 2>/dev/null || true; } | PUSH=1 bash tools/ci/changes.sh
          fi

  # Mức assets (PR / push chỉ ảnh, sprite, ghi công, tài liệu): bỏ cả job (skipped = xanh); `assets-check` thay thế (#1118). Mọi mức khác chạy đủ hai hệ điều hành.
  check-build:
    name: check-build
    needs: changes
    if: ${{ needs.changes.outputs.level != 'assets' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22 # khớp Dockerfile (node:22-slim)
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json
      # Cài root trước để các công cụ audio (ffmpeg-static) sẵn sàng cho test/validate.
      - run: npm ci --no-audit --no-fund
      - run: npm ci --no-audit --no-fund --prefix server && npm ci --no-audit --no-fund --prefix client
      - run: npm run test:audio
      - run: npm run test:audio --prefix client # AudioManager, nhạc nền (client/scripts/*-test.mjs, Node chạy thẳng .ts)
      - run: npm run test:nameplate --prefix client
      - run: npm run audio:validate
      - run: npm run check
      - run: npm run build
      - run: npm run budget # ngân sách dung lượng bản build (#743): vượt mốc × 1,1 thì đỏ
      - name: Kiểm diff cần preview cutter
        id: normalization-changes
        if: ${{ matrix.os == 'ubuntu-latest' && github.event_name == 'pull_request' }}
        shell: bash
        env:
          NORMALIZATION_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          NORMALIZATION_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$NORMALIZATION_BASE_SHA" "$NORMALIZATION_HEAD_SHA"
          if git diff --quiet "$NORMALIZATION_BASE_SHA" "$NORMALIZATION_HEAD_SHA" -- tools/assets/beast-sheet-cut.mjs tools/assets/beast-sheet-lib.mjs tools/assets/beast-sheet-normalization-preview.mjs tools/assets/beast-sheet.test.mjs tools/assets/beast-sheet-preview.mjs docs/art/hon-thu-hoat-anh.md; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            normalization_diff_status=$?
            if [ "$normalization_diff_status" -ne 1 ]; then exit "$normalization_diff_status"; fi
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Sinh preview chuẩn hóa cutter (chỉ kích thước)
        if: ${{ steps.normalization-changes.outputs.run == 'true' }}
        env:
          NORMALIZATION_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          NORMALIZATION_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node tools/assets/beast-sheet-normalization-preview.mjs --out "${{ runner.temp }}/beast-normalization-preview"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' && steps.normalization-changes.outputs.run == 'true' }}
        with:
          name: beast-normalization-preview-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/beast-normalization-preview
          retention-days: 30
          if-no-files-found: ignore

  actionbar-preview:
    name: actionbar-preview
    needs: changes
    if: ${{ needs.changes.outputs.level != 'skip' && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund --prefix server && npm ci --no-audit --no-fund --prefix client
      - run: npx --prefix client playwright install --with-deps chrome
      - name: Hồi quy thanh kỹ năng, đội hình và chat trong game thật
        if: ${{ !cancelled() }}
        run: npm run test:actionbar-browser --prefix client
        env:
          C8_OUTPUT: ${{ runner.temp }}/c8-preview
      - name: Thanh kỹ năng không tràn khỏi màn (cửa sổ 640–1280 px)
        if: ${{ !cancelled() }}
        run: npm run test:actbar-fit-browser --prefix client
        env:
          ACTBAR_FIT_OUT: ${{ runner.temp }}/actbar-fit
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: c8-preview-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/c8-preview
          retention-days: 30

  nameplate-preview:
    name: nameplate-preview
    needs: changes
    if: ${{ needs.changes.outputs.level == 'smoke' || needs.changes.outputs.level == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund --prefix server && npm ci --no-audit --no-fund --prefix client
      # Cache Chrome của Playwright theo phiên bản trong lock (#933): trúng cache chỉ cài thư viện hệ thống, trượt mới tải lại.
      - name: Phiên bản Playwright
        id: pw
        run: echo "version=$(node -p "require('./client/package-lock.json').packages['node_modules/playwright'].version")" >> "$GITHUB_OUTPUT"
      - name: Cache Chrome Playwright
        id: pw-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Cài Chrome Playwright
        id: pw-install
        timeout-minutes: 15
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            npx --prefix client playwright install-deps chromium
          else
            npx --prefix client playwright install --with-deps chromium
          fi
      # Lưu ngay sau bước cài thành công (kể cả khi bài sau trượt); chỉ lưu khi vừa tải mới, không lưu bản cài dở.
      - name: Lưu cache Chrome Playwright
        if: ${{ always() && steps.pw-cache.outputs.cache-hit != 'true' && steps.pw-install.outcome == 'success' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - run: npm run test:nameplate-browser --prefix client
        env:
          NAMEPLATE_OUTPUT: ${{ runner.temp }}/c9-preview
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: c9-preview-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/c9-preview
          retention-days: 30

  # Luồng đầu người chơi mới bằng trình duyệt thật (#713): landing → đăng ký → tạo nhân vật → Lễ thức tỉnh (thẻ võ hồn không chồng) → vào game, không lỗi console.
  # Chạy ở mức smoke và full (đổi giao diện client là chạm luồng này), ~2 phút gồm build client. Chỉ để tham khảo như bot-ram.
  flow-browser:
    name: flow-browser
    needs: changes
    if: ${{ needs.changes.outputs.level == 'smoke' || needs.changes.outputs.level == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm ci --no-audit --no-fund --prefix server && npm ci --no-audit --no-fund --prefix client
      # Cache Chrome của Playwright theo phiên bản trong lock (#933): trúng cache chỉ cài thư viện hệ thống, trượt mới tải lại.
      - name: Phiên bản Playwright
        id: pw
        run: echo "version=$(node -p "require('./client/package-lock.json').packages['node_modules/playwright'].version")" >> "$GITHUB_OUTPUT"
      - name: Cache Chrome Playwright
        id: pw-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Cài Chrome Playwright
        id: pw-install
        timeout-minutes: 15
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            npx --prefix client playwright install-deps chromium
          else
            npx --prefix client playwright install --with-deps chromium
          fi
      # Lưu ngay sau bước cài thành công (kể cả khi bài sau trượt); chỉ lưu khi vừa tải mới, không lưu bản cài dở.
      - name: Lưu cache Chrome Playwright
        if: ${{ always() && steps.pw-cache.outputs.cache-hit != 'true' && steps.pw-install.outcome == 'success' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - run: npm run test:flow-browser --prefix client
        timeout-minutes: 5
        env:
          FLOW_OUTPUT: ${{ runner.temp }}/flow-browser
      # Hai bài trình duyệt nhẹ cùng job (dùng lại Chrome + node_modules vừa cài, ~15 s và ~30 s ở máy; server RAM + vite riêng, có watchdog):
      # bảng không nuốt phím / chuột (U1 #754) và vào phòng / đổi bản đồ không rơi tin (#714 #715). Trước đây chỉ chạy tay nên PR giao diện làm hỏng mà không ai biết.
      - run: npm run test:panel-browser --prefix client
        if: ${{ !cancelled() }}
        timeout-minutes: 4
        env:
          PANEL_OUTPUT: ${{ runner.temp }}/flow-browser/panel
      - run: npm run test:hub-ten-browser --prefix client
        if: ${{ !cancelled() }}
        timeout-minutes: 4
        env:
          HUB_OUTPUT: ${{ runner.temp }}/flow-browser/hub-ten
      - run: npm run test:join-browser --prefix client
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      # Ô Giáp bằng ô trang bị khác + nền chú thích liền (PR #1588): mặc đủ 10 ô, quét cỡ chữ 0/1/2 × 4 độ phân giải; cùng job, dùng lại Chrome + node_modules.
      - run: npm run test:giap-tooltip-browser --prefix client
        if: ${{ !cancelled() }}
        timeout-minutes: 4
        env:
          BAG_OUTPUT: ${{ runner.temp }}/flow-browser/giap-tooltip
      - run: npm run test:hon-kinh-browser --prefix client
        if: ${{ !cancelled() }}
        timeout-minutes: 2
        env:
          HON_KINH_OUTPUT: ${{ runner.temp }}/flow-browser/hon-kinh
      - run: npm run test:calendar-icon-browser --prefix client
        if: ${{ !cancelled() }}
        timeout-minutes: 2
        env:
          CALENDAR_OUTPUT: ${{ runner.temp }}/flow-browser/calendar-icon
      # Thẻ Làm quen không che Hồn sư / Túi / Thư / Thành Tựu / Đội hình (#1601): đo hộp chồng nhau, 4 cỡ màn × 3 cỡ chữ; cùng job.
      - run: npm run test:onboard-cover-browser --prefix client
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        env:
          COVER_OUTPUT: ${{ runner.temp }}/flow-browser/onboard-cover
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ failure() }}
        with:
          name: flow-browser-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/flow-browser
          retention-days: 7
          if-no-files-found: ignore

  # Bài trình duyệt chặn lỗi đã sửa, trước đây chỉ chạy tay nên PR sau làm hỏng lại không ai biết (#1619).
  # Job riêng (không chung flow-browser) để một bài treo, vd #1617, không kéo cả flow-browser; mỗi bài có timeout riêng, `!cancelled()` nên bài trượt không che bài sau.
  # Mỗi bài tự dựng server RAM `GAME_TEST=1` + vite dev (không cần build); ở máy mỗi bài 6–25 s, cả job ~2 phút gồm cài đặt. Chỉ để tham khảo như flow-browser.
  # Chưa đưa vào (lý do ở docs/ops/ci.md): bando, resonance (>2 phút), npc-reply (chập chờn).
  browser-regress:
    name: browser-regress
    needs: changes
    if: ${{ needs.changes.outputs.level == 'smoke' || needs.changes.outputs.level == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm ci --no-audit --no-fund --prefix server && npm ci --no-audit --no-fund --prefix client
      # Cache Chrome của Playwright theo phiên bản trong lock (#933): trúng cache chỉ cài thư viện hệ thống, trượt mới tải lại.
      - name: Phiên bản Playwright
        id: pw
        run: echo "version=$(node -p "require('./client/package-lock.json').packages['node_modules/playwright'].version")" >> "$GITHUB_OUTPUT"
      - name: Cache Chrome Playwright
        id: pw-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Cài Chrome Playwright
        id: pw-install
        timeout-minutes: 15
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            npx --prefix client playwright install-deps chromium
          else
            npx --prefix client playwright install --with-deps chromium
          fi
      # Lưu ngay sau bước cài thành công (kể cả khi bài sau trượt); chỉ lưu khi vừa tải mới, không lưu bản cài dở.
      - name: Lưu cache Chrome Playwright
        if: ${{ always() && steps.pw-cache.outputs.cache-hit != 'true' && steps.pw-install.outcome == 'success' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      # Hộp thoại NPC ở màn thấp: nút chính thấy ngay, nút × luôn bấm được (#1648).
      - run: npm run test:npc-low-browser --prefix client
        if: ${{ !cancelled() }}
        timeout-minutes: 4
        env:
          NPC_LOW_OUTPUT: ${{ runner.temp }}/browser-regress/npc-low
      # Mã mua thật sự gửi khi lọc cửa hàng, Túi cập nhật từ server, đổi NPC (#1520).
      - run: npm run test:shop-search-browser --prefix client
        if: ${{ !cancelled() }}
        timeout-minutes: 4
        env:
          SHOP_OUTPUT: ${{ runner.temp }}/browser-regress/shop-search
      # Bàn phím thật / tiêu điểm khi theo dõi nhiệm vụ (#1554).
      - run: npm run test:quest-focus-browser --prefix client
        if: ${{ !cancelled() }}
        timeout-minutes: 3
        env:
          QUEST_FOCUS_OUTPUT: ${{ runner.temp }}/browser-regress/quest-focus
      # Thông báo nhận đồ trong chat (#1462, #1509).
      - run: npm run test:loot-chat-browser --prefix client
        if: ${{ !cancelled() }}
        timeout-minutes: 4
        env:
          LOOT_OUTPUT: ${{ runner.temp }}/browser-regress/loot-chat
      # Trạng thái Thư và Thành Tựu, sender / đồng hồ giả (#1565 / #1566).
      - run: npm run test:mail-achv-browser --prefix client
        if: ${{ !cancelled() }}
        timeout-minutes: 4
        env:
          REFRESH_OUTPUT: ${{ runner.temp }}/browser-regress/mail-achv
      # Bảng xếp hạng chuyển bảng, sender giả (#1526).
      - run: npm run test:rank-browser --prefix client
        if: ${{ !cancelled() }}
        timeout-minutes: 3
        env:
          RANK_OUTPUT: ${{ runner.temp }}/browser-regress/rank
      # Lựa chọn trong Thư.
      - run: npm run test:mail-browser --prefix client
        if: ${{ !cancelled() }}
        timeout-minutes: 3
        env:
          MAIL_OUTPUT: ${{ runner.temp }}/browser-regress/mail
      # Hồi quy quà Thư / Thành Tựu.
      - run: npm run test:gift-browser --prefix client
        if: ${{ !cancelled() }}
        timeout-minutes: 3
        env:
          GIFT_OUTPUT: ${{ runner.temp }}/browser-regress/gift
      # Thẻ kết thúc Làm quen trên game RAM (#1540).
      - run: npm run test:onboard-browser --prefix client
        if: ${{ !cancelled() }}
        timeout-minutes: 4
        env:
          ONBOARD_OUTPUT: ${{ runner.temp }}/browser-regress/onboard
      # Icon menu trên thẻ Hub: 19 mục có icon (#1579).
      - run: npm run test:hub-icon-browser --prefix client
        if: ${{ !cancelled() }}
        timeout-minutes: 3
        env:
          HUB_OUTPUT: ${{ runner.temp }}/browser-regress/hub-icon
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ failure() }}
        with:
          name: browser-regress-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/browser-regress
          retention-days: 7
          if-no-files-found: ignore

  # Kiểm tờ hoạt ảnh hồn thú (#866, theo dõi #861): PR đổi art/src/beast-anim/** hoặc tools/assets/beast-sheet-* thì chạy beast:check cho loài có tờ đổi.
  # Nhẹ: không npm ci (script chỉ dùng node:* và tools/assets), không Chrome / server; không needs nên chạy cả khi mức bot là skip.
  # Chặn chỉ khi cỡ ngoài tập / nền ngoài dung sai / thiếu khung / không dò được lưới; còn lại cảnh báo.
  beast-sheet-check:
    name: beast-sheet-check
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # đủ lịch sử để git diff base...head (chỉ file PR đổi, không lẫn file main mới)
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Danh sách file đổi
        id: files
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_SHA"..."$HEAD_SHA" > "$RUNNER_TEMP/changed.txt"
          if grep -Eq '^(art/src/beast-anim/|tools/assets/beast-sheet-)' "$RUNNER_TEMP/changed.txt"; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi
      - name: Kiểm tờ (beast:check cho loài đổi)
        if: ${{ steps.files.outputs.run == 'true' }}
        run: node tools/assets/beast-sheet-ci.mjs --files "$RUNNER_TEMP/changed.txt" --out "$RUNNER_TEMP/beast-check"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() && steps.files.outputs.run == 'true' }}
        with:
          name: beast-check-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/beast-check
          retention-days: 30
          if-no-files-found: ignore

  # Kiểm tờ UI Kit (#880, theo dõi #877, mẫu beast-sheet-check): PR đổi art/src/ui-kit/** hoặc tools/assets/ui-sheet-* / ui-kit-* thì chạy ui:check cho tờ đổi
  # và dựng trang bộ component (artifact ui-check). Nhẹ: không npm ci, không Chrome / server; không needs nên chạy cả khi mức bot là skip (không phá cơ chế art-only).
  # Chặn chỉ khi cỡ ngoài tập / nền ngoài dung sai / thiếu mảnh / không dò được dải; còn lại cảnh báo.
  ui-sheet-check:
    name: ui-sheet-check
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # đủ lịch sử để git diff base...head
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Danh sách file đổi
        id: files
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_SHA"..."$HEAD_SHA" > "$RUNNER_TEMP/changed.txt"
          if grep -Eq '^(art/src/ui-kit/|tools/assets/(ui-sheet-|ui-kit-))' "$RUNNER_TEMP/changed.txt"; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi
      - name: Kiểm tờ (ui:check cho tờ đổi) + dựng trang bộ component
        if: ${{ steps.files.outputs.run == 'true' }}
        run: node tools/assets/ui-sheet-ci.mjs --files "$RUNNER_TEMP/changed.txt" --out "$RUNNER_TEMP/ui-check"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() && steps.files.outputs.run == 'true' }}
        with:
          name: ui-check-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/ui-check
          retention-days: 30
          if-no-files-found: ignore

  # Mức assets (#1118): thay check-build cho PR / push chỉ đổi ảnh, sprite, ghi công, tài liệu. Ubuntu, không npm ci / build / Chrome / server / bot
  # (các công cụ dưới chỉ dùng node:*), mục tiêu ≤ 3 phút. Gồm mọi bài của `npm run check` kiểm trực tiếp file mức assets và chỉ cần node:*.
  # Chỉ chạy ở mức assets (mức khác đã có `npm run check` trong check-build). Thêm bài nhẹ thì thêm vào đây, đừng kéo build / bot vào.
  assets-check:
    name: assets-check
    needs: changes
    if: ${{ needs.changes.outputs.level == 'assets' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22 # khớp Dockerfile (node:22-slim)
      - run: node tools/assets/validate.mjs
      - run: node tools/assets/quality.mjs --check
      - run: node tools/assets/credits.mjs --check
      - run: node tools/assets/normal-quant.mjs --check # `*_n.png` đã lượng tử (#975)
      - run: node tools/assets/lpc-parts.mjs --check # ngân sách / toàn vẹn món LPC
      - run: node tools/assets/iso-atlas.mjs --check # atlas ô / vật khớp ảnh nguồn sprites/iso
      - run: node tools/maps/quet-chan.mjs # vật vẽ khớp ô chặn (xoá / đổi tên prop không để tường vô hình)
      - run: node tools/ci/check-private-assets.mjs # chặn gói riêng / giấy phép hạn chế lọt vào repo công khai
      - run: node tools/docs-check.mjs # PR chỉ đổi tài liệu cũng được kiểm (trước đây nhờ `npm run check` trong check-build)
      - name: manifest.json / credits.json đọc được
        run: |
          node -e 'for (const f of ["shared/assets/sprites/manifest.json","shared/assets/credits/credits.json"]) { JSON.parse(require("fs").readFileSync(f, "utf8")); console.log("✓", f); }'
      - run: node --experimental-strip-types client/scripts/beastanim-test.mjs # chọn khung hoạt ảnh (client/src/beastAnim.ts), không cần client/node_modules

  # Bài test đơn vị chạy nhanh (không server, không DB): trang bị, đăng nhập Google, khóa món, GM, cache tĩnh, hiệu ứng client, công cụ ảnh / tài liệu (#660).
  # Gộp ở `npm run test:unit` (gốc package.json); thêm bài mới thì thêm vào đó. Chỉ ubuntu, song song với check-build nên không làm CI chậm thêm.
  test-unit:
    name: test-unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22 # khớp Dockerfile (node:22-slim)
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm ci --no-audit --no-fund --prefix server && npm ci --no-audit --no-fund --prefix client
      - run: npm run test:unit

  # Build thử image (không push, K1 #500): chạy khi PR đổi Dockerfile / .dockerignore / package*.json (gốc, server, client), và luôn chạy trên main.
  # Bản build thật + thử bằng bot + quét lỗ hổng + đẩy lên registry nằm ở release.yml. Job này chỉ bắt lỗi Dockerfile sớm ở PR.
  docker-build:
    name: docker-build
    needs: changes
    if: ${{ needs.changes.outputs.level != 'assets' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # đủ lịch sử để git diff base...head
          persist-credentials: false
      - id: need
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          LEVEL: ${{ needs.changes.outputs.level }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            if [ "$LEVEL" = skip ]; then echo "run=false" >>"$GITHUB_OUTPUT"; echo "push mức skip: bỏ qua build thử"; else echo "run=true" >>"$GITHUB_OUTPUT"; echo "push vào main: build thử"; fi
            exit 0
          fi
          if git diff --name-only "$BASE...$HEAD" | grep -Eq '^(Dockerfile|\.dockerignore|package(-lock)?\.json|(server|client)/package(-lock)?\.json)$'; then
            echo "run=true" >>"$GITHUB_OUTPUT"
          else
            echo "run=false" >>"$GITHUB_OUTPUT"; echo "PR không đổi Dockerfile / .dockerignore / package*.json: bỏ qua build thử"
          fi
      - name: build image (không push)
        if: steps.need.outputs.run == 'true'
        run: DOCKER_BUILDKIT=1 docker build --build-arg REVISION="$GITHUB_SHA" -t soul-land-game:ci .
      # Chạy thử nhanh: server lên được, /health trả ok, client đã build được phục vụ, không chạy bằng root.
      - name: chạy thử container (/health, client, user)
        if: steps.need.outputs.run == 'true'
        run: |
          docker run -d --name game-ci -p 2567:2567 soul-land-game:ci
          for i in $(seq 1 60); do curl -sf localhost:2567/health && break; sleep 1; done
          echo; curl -sf localhost:2567/health
          curl -sf localhost:2567/ | head -c 200 | grep -qi "<html" || { echo "✗ landing (/) đã build không được phục vụ"; docker logs game-ci; exit 1; }
          curl -sf localhost:2567/choi | grep -q 'id="stage"' || { echo "✗ game (/choi, không gạch cuối) không được phục vụ"; docker logs game-ci; exit 1; }
          curl -sf localhost:2567/choi/ | grep -q 'id="stage"' || { echo "✗ game (/choi/) không được phục vụ"; docker logs game-ci; exit 1; }
          [ "$(docker exec game-ci id -u)" != 0 ] || { echo "✗ container chạy bằng root"; exit 1; }
          docker logs game-ci | tail -n 20
      - name: cỡ image
        if: steps.need.outputs.run == 'true'
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          size() { docker image inspect "$1" --format '{{.Size}}' | awk '{printf "%.0f MB", $1/1048576}'; }
          { echo "### Image: \`soul-land-game\`"; echo ""; echo "| | Cỡ |"; echo "|---|---|"; echo "| bản này | $(size soul-land-game:ci) |"; } >>"$GITHUB_STEP_SUMMARY"
          # PR đổi Dockerfile: dựng thêm Dockerfile của base để so cỡ cũ / mới.
          if [ "$EVENT" = pull_request ] && ! git diff --quiet "$BASE" HEAD -- Dockerfile; then
            git show "$BASE:Dockerfile" >Dockerfile.base
            if DOCKER_BUILDKIT=1 docker build -f Dockerfile.base -t soul-land-game:base . >/dev/null 2>&1; then
              echo "| base (Dockerfile cũ) | $(size soul-land-game:base) |" >>"$GITHUB_STEP_SUMMARY"
            else
              echo "| base (Dockerfile cũ) | không dựng được |" >>"$GITHUB_STEP_SUMMARY"
            fi
          fi
          cat "$GITHUB_STEP_SUMMARY" | tail -n 6
      - if: ${{ always() }}
        run: docker rm -f game-ci >/dev/null 2>&1 || true

  # Bot RAM và các bài thử nhanh (#171), chỉ ubuntu. Chỉ để tham khảo như check-build (không bắt buộc trong bảo vệ nhánh).
  # Bot đầy đủ chạy ~35 phút trên runner nên chia 6 nhóm song song (BOT_PART; phần nào thuộc nhóm nào khai báo ở INLINE / STANDALONE
  # trong client/scripts/bot-test.mjs, #236), mỗi nhóm một server mới bật, ~7 phút (runner chậm ~9). Thêm / bớt nhóm thì sửa cả BOT_PARTS
  # (bot báo ✗ khi matrix lệch). Nhóm 1 chạy thêm các bài nhanh và lượt nhiều kênh. Job bot-ram (cuối file) gộp kết quả thành một status check.
  bot-ram-part:
    name: bot-ram (nhóm ${{ matrix.part }})
    needs: changes
    if: ${{ needs.changes.outputs.level == 'full' }}
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4, 5, 6]
    runs-on: ubuntu-latest
    # Lề cho npm ci chậm khi không trúng cache; bot treo thì bước bot tự dừng ở timeout riêng (dưới) để còn log và artifact.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22 # khớp Dockerfile (node:22-slim)
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json
      # node_modules theo hash lockfile: trúng cache thì bỏ npm ci (có lượt npm ci mất 7–11 phút vì registry / audit chậm, #236).
      - id: nm
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            server/node_modules
            client/node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('server/package-lock.json', 'client/package-lock.json') }}
      - id: deps
        env:
          HIT: ${{ steps.nm.outputs.cache-hit }}
        run: |
          if [ "$HIT" = true ]; then echo "node_modules lấy từ cache"; exit 0; fi
          npm ci --no-audit --no-fund --prefix server && npm ci --no-audit --no-fund --prefix client
      # Các bài sau chạy độc lập (một bài đỏ vẫn chạy bài khác) miễn là đã cài xong thư viện.
      - if: ${{ !cancelled() && steps.deps.outcome == 'success' && matrix.part == 1 }}
        run: npm run test:predict --prefix client
      - if: ${{ !cancelled() && steps.deps.outcome == 'success' && matrix.part == 1 }}
        run: npm run test:charbag --prefix client
      - if: ${{ !cancelled() && steps.deps.outcome == 'success' && matrix.part == 1 }}
        run: npm run test:radar --prefix server
      - if: ${{ !cancelled() && steps.deps.outcome == 'success' && matrix.part == 1 }}
        run: npm run test:autopath --prefix server
      - if: ${{ !cancelled() && steps.deps.outcome == 'success' && matrix.part == 1 }}
        run: npm run test:clickgoal --prefix server
      - if: ${{ !cancelled() && steps.deps.outcome == 'success' && matrix.part == 1 }}
        run: npm run test:control --prefix server
      - if: ${{ !cancelled() && steps.deps.outcome == 'success' && matrix.part == 1 }}
        run: npm run test:ratelimit --prefix server
      - if: ${{ !cancelled() && steps.deps.outcome == 'success' && matrix.part == 1 }}
        run: npm run test:accounts --prefix server
      # Mỗi lượt một server mới bật (GAME_TEST=1, RAM); bot trượt (dòng ✗) thì bước đỏ và in log server. Số ✓ / ✗ / ⚠ in thành annotation (gh run view) và bảng ở trang lượt chạy.
      # Bình thường ~7–8 phút (6 nhóm, #684); quá 12 phút là treo (hoặc nhóm lệch, xem dòng ⏱ để chia lại).
      - name: bot nhóm ${{ matrix.part }} (server GAME_TEST=1, RAM)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        timeout-minutes: 12
        env:
          BOT_PART: ${{ matrix.part }}
          BOT_PARTS_CI: ${{ strategy.job-total }}
        run: bash tools/ci/bot-run.sh "nhom-$BOT_PART"
      - name: bot nhiều kênh (CHANNEL_MAX=2)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' && matrix.part == 1 }}
        timeout-minutes: 3
        run: bash tools/ci/bot-run.sh channel CHANNEL_MAX=2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ failure() }}
        with:
          name: bot-logs-${{ matrix.part }}
          path: ci-logs/
          retention-days: 7

  # Mức smoke: test client + một lượt bot khói (BOT_PART=smoke: phần chung + vài bài nhẹ). Bước cài thư viện giống bot-ram-part.
  bot-smoke:
    name: bot-smoke
    needs: changes
    if: ${{ needs.changes.outputs.level == 'smoke' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22 # khớp Dockerfile (node:22-slim)
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json
      - id: nm
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            server/node_modules
            client/node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('server/package-lock.json', 'client/package-lock.json') }}
      - id: deps
        env:
          HIT: ${{ steps.nm.outputs.cache-hit }}
        run: |
          if [ "$HIT" = true ]; then echo "node_modules lấy từ cache"; exit 0; fi
          npm ci --no-audit --no-fund --prefix server && npm ci --no-audit --no-fund --prefix client
      - if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run test:predict --prefix client
      - if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run test:charbag --prefix client
      - name: bot khói (server GAME_TEST=1, RAM)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        timeout-minutes: 6
        env:
          BOT_PART: smoke
        run: bash tools/ci/bot-run.sh khoi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ failure() }}
        with:
          name: bot-logs-khoi
          path: ci-logs/
          retention-days: 7

  # Presence với Redis thật (#497, tiếp #419; tùy chọn, không bắt buộc): service Redis cục bộ trong job, chạy test:presence-kill (kill PID, TTL)
  # và bot arena hai tiến trình (bot:local --procs 2, log ở ci-logs/). Chỉ ở mức full. Chưa đưa bài friend --procs 2 vào tới khi
  # issue chập chờn tương ứng (#495) xong.
  presence-redis:
    name: presence-redis
    needs: changes
    if: ${{ needs.changes.outputs.level == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # PostgreSQL tạm: nhiều tiến trình phải dùng chung kho tài khoản (token ở RAM từng tiến trình thì tiến trình 2 trả 401);
    # mật khẩu chỉ của service container tạm trong runner.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: soul
          POSTGRES_PASSWORD: soul-ci-tam
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U soul"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      REDIS_URL: redis://127.0.0.1:6379
      BOT_PG_URL: postgres://soul:soul-ci-tam@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22 # khớp Dockerfile (node:22-slim)
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm ci --no-audit --no-fund --prefix server && npm ci --no-audit --no-fund --prefix client
      - name: test:presence-kill (Redis thật)
        timeout-minutes: 3
        env:
          REDIS_PREFIX: test:presence-kill
        run: npm run test:presence-kill --prefix server
      # #1621: bài thử cần binary redis-server (tự bật Redis riêng ở cổng trống rồi tắt / bật lại giữa lúc 2 server có người chơi); service
      # container ở trên chỉ là cổng 6379, không có binary trong PATH. apt-get cài kèm sẵn một redis-server tự chạy ở 6379 (đụng service)
      # nên tắt hẳn bằng systemctl disable --now để không có tiến trình thứ hai / systemd khởi động lại tranh cổng với service; bài thử không dùng cổng đó. PostgreSQL chung là BOT_PG_URL của job (bài tự tạo / xoá database riêng).
      - name: cài redis-server (binary cho test:presence-outage)
        if: ${{ !cancelled() }}
        timeout-minutes: 3
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends redis-server
          sudo systemctl disable --now redis-server || true
          redis-server --version
      - name: test:presence-outage (Redis mất rồi có lại, #561)
        if: ${{ !cancelled() }}
        timeout-minutes: 4
        shell: bash # pipefail: tee không che mã thoát của bài thử
        env:
          OUTAGE_SECS: "8"
          BOT_REDIS_BIN: redis-server
        run: |
          mkdir -p ci-logs
          npm run test:presence-outage --prefix server 2>&1 | tee ci-logs/presence-outage.log
      - name: bot arena hai tiến trình (--procs 2)
        if: ${{ !cancelled() }}
        timeout-minutes: 8
        env:
          BOT_STRICT_HOOK: "1" # bài bỏ qua vì thiếu hook test ghi ✗ (#958)
        run: npm run bot:local -- --only arena --procs 2 --pg --env REDIS_URL="$REDIS_URL"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ failure() }}
        with:
          name: presence-redis-logs
          path: ci-logs/
          retention-days: 7
          if-no-files-found: ignore

  # Một status check bot-ram cho mọi mức: full gộp 6 nhóm (đỏ khi có nhóm trượt / bị hủy / hết giờ), smoke theo bot-smoke,
  # skip báo success (không chạy bot).
  bot-ram:
    name: bot-ram
    needs: [changes, bot-ram-part, bot-smoke]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          LEVEL: ${{ needs.changes.outputs.level }}
          RESULT: ${{ needs.changes.result != 'success' && 'changes-loi' || (needs.changes.outputs.level == 'full' && needs.bot-ram-part.result) || (needs.changes.outputs.level == 'smoke' && needs.bot-smoke.result) || 'success' }}
        # Phân biệt "có dòng ✗ / bước bot quá 12 phút" (failure) với "job bị hủy / hết 20 phút" (cancelled) để người đọc khỏi nhầm.
        run: |
          echo "bot-ram (mức $LEVEL): $RESULT"
          case "$RESULT" in
            changes-loi) echo "::error title=bot-ram::job changes lỗi, không chọn được mức bot" ;;
            success) ;;
            failure) echo "::error title=bot-ram::có nhóm trượt (dòng ✗) hoặc bước bot quá 12 phút (treo): xem annotation từng nhóm" ;;
            cancelled) echo "::error title=bot-ram::có nhóm bị hủy hoặc hết giờ job (thường do runner / npm ci chậm, chưa chắc là lỗi bot)" ;;
            *) echo "::error title=bot-ram::kết quả $RESULT" ;;
          esac
          [ "$RESULT" = success ]
