# Release (K3, #500): sau khi CI của main xanh, dựng image, THỬ image, quét lỗ hổng, rồi mới đẩy lên Artifact Registry.
#   1) buildx (cache GHA) dựng image, nạp vào docker local;
#   2) chạy container đó + PostgreSQL tạm (service container, DB rỗng) và bot khói vào container (GAME_TEST=1 chỉ ở bước này);
#   3) Trivy chặn lỗ hổng CRITICAL;
#   4) đạt cả ba mới đăng nhập GCP (key JSON của service account GCP_SA_KEY, hoặc Workload Identity Federation nếu không có key) và đẩy ĐÚNG image đã thử với tag sha-<7> (+ main nếu mới hơn bản main hiện có).
# Không tự deploy: đưa lên prod bằng promote.yml (mở PR ở repo GitOps), xem docs/ops/trien-khai.md. Thiết lập GCP: deploy/gcp/README.md.
# Thông báo chỉ qua GitHub: lượt chạy ở tab Actions, trạng thái commit `release/image` và bảng tóm tắt (GITHUB_STEP_SUMMARY).
name: Release
# Tên lượt = commit được build (workflow_run: commit của CI; chạy tay: đầu main lúc bấm). Một lượt chỉ build đúng commit này.
run-name: Release ${{ github.event.workflow_run.head_sha || github.sha }}

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch: # chạy tay trên main: dựng + thử + đẩy lại bản mới nhất của main (cần khi lượt tự động bị lỡ)

permissions:
  contents: read

env:
  IMAGE: asia-southeast1-docker.pkg.dev/landing-page-455614/soul-land/game
  REGISTRY: asia-southeast1-docker.pkg.dev

jobs:
  # Cổng: commit chỉ đổi thứ không vào image (art/**, docs/**, *.md, tools/, .github/...) thì không dựng lại (CI đã bỏ bot cho các commit art / docs).
  # Image chỉ gồm server/**, client/**, shared/**, Dockerfile, package*.json (xem Dockerfile + .dockerignore). Không so được thì dựng (không chắc thì dựng).
  # Chạy tay luôn dựng. Concurrency nằm ở job `release` (không phải cả workflow) để lượt bị bỏ qua không thay thế lượt dựng đang chờ.
  gate:
    name: cần dựng image?
    if: ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: write
    outputs:
      build: ${{ steps.need.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - id: need
        env:
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          build=true
          if [ "$EVENT" = workflow_run ]; then
            if files=$(git diff --name-only HEAD^ HEAD 2>/dev/null) && [ -n "$files" ]; then
              echo "$files"
              if ! echo "$files" | grep -Eq '^(server|client|shared)/|^Dockerfile$|^\.dockerignore$|^package(-lock)?\.json$'; then build=false; fi
            else
              echo "không so được với commit cha: dựng"
            fi
          fi
          echo "build=$build" >>"$GITHUB_OUTPUT"
          if [ "$build" = false ]; then
            echo "Commit không đổi thứ nào vào image: bỏ qua dựng." | tee -a "$GITHUB_STEP_SUMMARY"
            gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state=success -f context=release/image -f description="bỏ qua: commit không đổi image" -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
          fi

  release:
    name: build, thử, quét, đẩy image
    needs: gate
    # Mỗi lượt xếp hàng, không hủy lượt đang đẩy dở; lượt chờ cũ hơn bị thay bằng lượt mới nhất (bản main mới nhất luôn được dựng).
    concurrency:
      group: release
      cancel-in-progress: false
    # Chỉ khi CI trên push vào main xanh (không chạy cho PR, không chạy khi CI đỏ). Chạy tay thì chỉ được chạy trên main.
    if: ${{ needs.gate.outputs.build == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write # đổi token OIDC lấy quyền GCP khi dùng WIF (chỉ dùng sau khi image đã đạt)
      statuses: write # trạng thái commit release/image
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    # DB rỗng, chỉ sống trong lượt này; mật khẩu dưới đây chỉ là của service container tạm (không phải bí mật, không nối ra ngoài runner).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: soul
          POSTGRES_PASSWORD: soul-ci-tam
          POSTGRES_DB: soul_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U soul -d soul_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: trạng thái commit = đang chạy
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state=pending -f context=release/image -f description="đang dựng và thử image" -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
          persist-credentials: false
      # Asset kho riêng (#623, docs/asset-rieng.md): gói giấy phép hạn chế không nằm trong repo công khai. Có secret ASSETS_DEPLOY_KEY (deploy key CHỈ ĐỌC của
      # nguyenbinhanltv/soul-land-assets-private) thì clone depth 1 vào shared/assets/private/ (Dockerfile COPY shared nên vào image). Không có secret (chưa
      # cấu hình / fork) hoặc clone lỗi thì build vẫn chạy, game dùng hình cũ. Key chỉ đi qua env -> file tạm 0600, xóa ngay sau khi clone, không in ra log.
      - id: private-assets
        name: kéo kho asset riêng (nếu đã cấu hình)
        env:
          ASSETS_DEPLOY_KEY: ${{ secrets.ASSETS_DEPLOY_KEY }}
          ASSETS_REPO: nguyenbinhanltv/soul-land-assets-private
        run: |
          if [ -z "$ASSETS_DEPLOY_KEY" ]; then
            echo "::notice title=asset riêng::Chưa có secret ASSETS_DEPLOY_KEY: bỏ qua kho asset riêng, image dùng hình cũ."
            echo "private=no" >>"$GITHUB_OUTPUT"; exit 0
          fi
          key=$(mktemp); trap 'rm -f "$key"' EXIT
          printf '%s\n' "$ASSETS_DEPLOY_KEY" >"$key"; chmod 600 "$key"
          if GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=$RUNNER_TEMP/known_hosts" \
               git clone --depth 1 --quiet "git@github.com:$ASSETS_REPO.git" "$RUNNER_TEMP/assets-private"; then
            mkdir -p shared/assets/private
            # Chỉ packs/ + present.json (shared/assets là publicDir của Vite: licenses/, CREDITS-private.md, preview.html không cần phục vụ).
            cp -r "$RUNNER_TEMP/assets-private/packs" "$RUNNER_TEMP/assets-private/present.json" shared/assets/private/
            echo "private=yes" >>"$GITHUB_OUTPUT"
            echo "Kho asset riêng: $(find shared/assets/private -type f | wc -l) file."
          else
            echo "::warning title=asset riêng::Không clone được kho asset riêng (kiểm deploy key / tên repo): image dùng hình cũ."
            echo "private=no" >>"$GITHUB_OUTPUT"
          fi
      - id: meta
        run: |
          echo "tag=sha-${SHA:0:7}" >>"$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >>"$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: dựng image (cache GHA, nạp vào docker local)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
          build-args: |
            VERSION=${{ steps.meta.outputs.tag }}
            REVISION=${{ env.SHA }}
            CREATED=${{ steps.meta.outputs.created }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---- Thử image: container thật + Postgres tạm. GAME_TEST=1 chỉ có ở container này (không có trong image / bản đẩy lên). ----
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22 # khớp Dockerfile (node:22-slim)
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci --no-audit --no-fund --prefix client # bot (client/scripts/bot-test.mjs) cần colyseus.js
      - name: chạy container (DB tạm, GAME_TEST=1) và bot khói
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          # Chỉ localhost (service container). bot-image.sh từ chối mọi URL / DATABASE_URL không phải localhost (#406).
          DATABASE_URL: postgres://soul:soul-ci-tam@127.0.0.1:5432/soul_ci
        run: |
          mkdir -p ci-logs
          docker run -d --name game --network host \
            -e PORT=3141 -e GAME_TEST=1 -e DATABASE_URL -e TRUST_PROXY=1 \
            "$IMAGE:$TAG"
          # Chạy hai lần liền (migration phải chạy lại an toàn): container lên lần đầu, bot chạy, rồi bật lại trên cùng DB và kiểm /health.
          set +e
          bash tools/ci/bot-image.sh http://localhost:3141
          code=$?
          docker logs game >ci-logs/image-server.log 2>&1
          docker stop -t 15 game >/dev/null
          if [ "$code" -eq 0 ]; then
            docker rm game >/dev/null
            docker run -d --name game --network host -e PORT=3141 -e DATABASE_URL "$IMAGE:$TAG" >/dev/null
            for i in $(seq 1 60); do curl -sf localhost:3141/health && break; sleep 1; done
            curl -sf localhost:3141/health >/dev/null || { echo "✗ bật lại trên DB đã có dữ liệu không lên được"; docker logs game | tail -n 50; code=1; }
            [ "$code" -eq 0 ] && echo "" && echo "bật lại trên DB đã migrate: /health ok"
            docker logs game >>ci-logs/image-server.log 2>&1
            docker stop -t 15 game >/dev/null
          fi
          if [ "$code" -ne 0 ]; then echo "---- log server (200 dòng cuối) ----"; tail -n 200 ci-logs/image-server.log; fi
          exit "$code"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ failure() }}
        with:
          name: image-test-logs
          path: ci-logs/
          retention-days: 7

      # ---- Quét lỗ hổng: CRITICAL thì chặn. ignore-unfixed: lỗi chưa có bản vá thì không chặn được bằng cách cập nhật. ----
      - name: Trivy (chặn CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
      - name: Trivy bảng HIGH để tham khảo (không chặn)
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
          severity: HIGH
          ignore-unfixed: true
          exit-code: "0"
          format: table

      # ---- Đạt hết mới đăng nhập GCP và đẩy. ----
      # Đăng nhập GCP: ưu tiên key JSON của service account (secret GCP_SA_KEY); không có thì dùng Workload Identity Federation.
      # Key chỉ đi qua secret -> action (action ghi file tạm của runner, không in ra log).
      - id: gcp-mode
        name: chọn cách đăng nhập GCP
        env:
          HAS_KEY: ${{ secrets.GCP_SA_KEY != '' }}
          HAS_WIF: ${{ (vars.GCP_WIF_PROVIDER || secrets.GCP_WIF_PROVIDER) != '' && (vars.GCP_SA_EMAIL || secrets.GCP_SA_EMAIL) != '' }}
        run: |
          if [ "$HAS_KEY" = true ]; then echo "mode=key" >>"$GITHUB_OUTPUT"; echo "Đăng nhập GCP bằng key service account (GCP_SA_KEY)"
          elif [ "$HAS_WIF" = true ]; then echo "mode=wif" >>"$GITHUB_OUTPUT"; echo "Đăng nhập GCP bằng Workload Identity Federation"
          else echo "::error title=gcp::Thiếu cấu hình đăng nhập GCP: đặt secret GCP_SA_KEY (key JSON của service account), hoặc cặp GCP_WIF_PROVIDER + GCP_SA_EMAIL (Variable hoặc Secret). Xem deploy/gcp/README.md."; exit 1; fi
      - name: đăng nhập GCP (key service account)
        if: ${{ steps.gcp-mode.outputs.mode == 'key' }}
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - name: đăng nhập GCP (Workload Identity Federation)
        if: ${{ steps.gcp-mode.outputs.mode == 'wif' }}
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER || secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_EMAIL || secrets.GCP_SA_EMAIL }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: đẩy image (sha-7 ký tự, và main nếu mới hơn bản main hiện có)
        id: push
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gcloud auth configure-docker "$REGISTRY" --quiet # credential helper của gcloud, dùng chung cho key và WIF (không đụng token trong lệnh)
          docker push "$IMAGE:$TAG"
          # Chỉ dời tag main tiến lên, không bao giờ lùi: dời khi commit này là đầu main, hoặc mới hơn (theo git) commit của bản main hiện có trên registry.
          # Trước đây chỉ dời khi còn là đầu main -> merge liên tiếp thì mọi lượt đều thấy "main đã mới hơn" và tag main đứng yên ở bản cũ.
          HEAD_MAIN=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          MOVE=no; WHY=""
          if [ "$HEAD_MAIN" = "$SHA" ]; then MOVE=yes; WHY="đây là đầu main"
          else
            # Ghi ra file (không qua pipe) để lỗi gcloud không bị nuốt; không đọc được registry thì KHÔNG dời main (an toàn, lần release sau dời).
            if gcloud artifacts docker tags list "$IMAGE" --format='value(tag,version)' >tags.txt; then
              READ=yes
              MAIN_V=$(awk '{ n=split($1,a,"/"); if (a[n]=="main") print $2 }' tags.txt)
              OLD_TAG=""
              [ -n "$MAIN_V" ] && OLD_TAG=$(awk -v v="$MAIN_V" '{ n=split($1,a,"/"); if ($2==v && a[n] ~ /^sha-/) print a[n] }' tags.txt | head -n 1)
            else
              READ=no
            fi
            if [ "$READ" = no ]; then WHY="không đọc được tag trên registry (thiếu quyền / lỗi mạng), giữ nguyên main"
            elif [ -z "$MAIN_V" ]; then MOVE=yes; WHY="registry chưa có tag main"
            elif [ -z "$OLD_TAG" ]; then MOVE=yes; WHY="tag main hiện có không kèm sha-* (không so được), coi như cũ"
            else
              REL=$(gh api "repos/$GITHUB_REPOSITORY/compare/${OLD_TAG#sha-}...$SHA" --jq .status 2>/dev/null || echo unknown)
              case "$REL" in ahead|identical) MOVE=yes; WHY="mới hơn bản main hiện có ($OLD_TAG)";; *) WHY="không mới hơn bản main hiện có ($OLD_TAG, quan hệ: $REL)";; esac
            fi
          fi
          if [ "$MOVE" = yes ]; then
            docker tag "$IMAGE:$TAG" "$IMAGE:main"
            docker push "$IMAGE:main"
            echo "main=yes" >>"$GITHUB_OUTPUT"
            echo "::notice title=release::tag main -> $TAG ($WHY)"
          else
            echo "::notice title=release::chỉ đẩy $TAG, không đổi tag main: $WHY"
            echo "main=no" >>"$GITHUB_OUTPUT"
          fi
          DIGEST=$(docker image inspect "$IMAGE:$TAG" --format '{{index .RepoDigests 0}}' 2>/dev/null || true)
          echo "digest=${DIGEST#*@}" >>"$GITHUB_OUTPUT"
          docker logout "$REGISTRY" >/dev/null 2>&1 || true
      - name: tóm tắt
        if: ${{ success() }}
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          MAIN: ${{ steps.push.outputs.main }}
          DIGEST: ${{ steps.push.outputs.digest }}
          PRIVATE: ${{ steps.private-assets.outputs.private }}
        run: |
          SIZE=$(docker image inspect "$IMAGE:$TAG" --format '{{.Size}}' | awk '{printf "%.0f MB", $1/1048576}')
          {
            echo "### Release \`$TAG\` đã đẩy lên Artifact Registry"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Image | \`$IMAGE:$TAG\` |"
            echo "| Tag main | $([ "$MAIN" = yes ] && echo "đã trỏ về bản này" || echo "không đổi (đã có bản main mới hơn)") |"
            echo "| Digest | \`${DIGEST:-?}\` |"
            echo "| Cỡ | $SIZE |"
            echo "| Commit đã build | \`$SHA\` ($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$SHA); image chứa mọi commit tới commit này |"
            echo "| Asset riêng | $([ "$PRIVATE" = yes ] && echo "đã kèm kho riêng" || echo "không có (hình cũ)") |"
            echo "| Thử trước khi đẩy | container + PostgreSQL tạm, bot khói đạt, Trivy không có CRITICAL |"
            echo ""
            echo "Chưa deploy. Đưa lên prod: chạy workflow **Promote** (nhập \`$TAG\`), xem docs/ops/trien-khai.md."
          } >>"$GITHUB_STEP_SUMMARY"
      - name: trạng thái commit = kết quả
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          case "$RESULT" in
            success) state=success; desc="image $TAG đã đẩy lên registry (chưa deploy)" ;;
            cancelled) state=error; desc="lượt release bị hủy" ;;
            *) state=failure; desc="release trượt: xem lượt chạy (bot khói / Trivy / đẩy image)" ;;
          esac
          gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state="$state" -f context=release/image -f description="$desc" -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
