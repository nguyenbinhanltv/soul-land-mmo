# Sổ trạng thái hoạt ảnh hồn thú (#973, theo dõi #766): sau mỗi lần main đổi art/src/beast-anim/**, sinh lại bảng bằng `beast-status.mjs`
# và SỬA comment của bot có dấu `<!-- beast-status -->` ở issue #766 (chưa có thì tạo; chủ repo ghim comment đó một lần).
# PR H4 không commit `_status.*` nữa (file nằm trong .gitignore) nên các PR song song không xung đột.
# Chỉ dùng GITHUB_TOKEN (contents: read, issues: write); không secret nào khác. Không chạy trên PR, nên PR từ nhánh ngoài không đụng được issue.
name: Beast status

on:
  push:
    branches: [main]
    paths:
      - "art/src/beast-anim/**"
      - "tools/assets/beast-*.mjs"
      - "tools/ci/beast-status-comment.mjs"
      - ".github/workflows/beast-status.yml"
  workflow_dispatch:

permissions:
  contents: read

# Một lượt tại một thời điểm; lượt mới đợi lượt cũ xong rồi ghi đè (luôn ra bảng của commit mới nhất).
concurrency:
  group: beast-status
  cancel-in-progress: false

jobs:
  status:
    name: sửa comment sổ ở #766
    # Chỉ main (workflow_dispatch chọn nhánh khác thì bỏ qua, tránh đăng bảng của nhánh chưa merge lên issue thật).
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Sinh sổ (ra thư mục tạm, không đụng cây git)
        run: node tools/assets/beast-status.mjs --out "$RUNNER_TEMP/beast-status"
      - name: Job summary (bản đầy đủ)
        run: cat "$RUNNER_TEMP/beast-status/_status.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: beast-status
          path: ${{ runner.temp }}/beast-status/
          retention-days: 30
      - name: Sửa comment ở #766
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node tools/ci/beast-status-comment.mjs --file "$RUNNER_TEMP/beast-status/_status.md" --issue 766 --run-url "$RUN_URL"
