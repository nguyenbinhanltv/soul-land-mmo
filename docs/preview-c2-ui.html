<!doctype html>
<meta charset="utf-8">
<title>Preview C2 · Nền và khung giao diện</title>
<style>
  :root{color-scheme:dark;background:#10141c;color:#ece2c8;font:16px system-ui,sans-serif}

  .motifs{display:flex;gap:18px;align-items:center;justify-content:center;flex-wrap:wrap}
